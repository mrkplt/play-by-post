# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# rubocop-erb lints the Ruby fragments inside .html.erb templates — Ruby style
# the plain rubocop run never saw, since .erb is not in its default target set.
# This is distinct from and complementary to the ERB-logic gate in
# bin/quality-metrics, which enforces the architectural rule that view templates
# carry no logic at all (ternaries/||/control-flow in output tags); rubocop-erb
# styles the Ruby that legitimately remains. The plugin pulls every app/**/*.erb
# into scope automatically. By default it Excludes ~54 cops from .erb; the block
# below re-enables all of them that can be reconfigured (all but Lint/Syntax), so
# the full inherited Ruby ruleset applies to embedded Ruby.
plugins:
  - rubocop-erb

# --- rubocop-erb: re-enable cops the plugin excludes from .erb by default ---
#
# rubocop-erb 0.7.1 ships a default config that Excludes ~54 cops from **/*.erb.
# Enabling them here applies the full inherited Ruby ruleset to the Ruby embedded
# in templates. Verified against the whole app/**/*.erb tree: zero offenses today,
# and the Layout/indentation cops are inert on ERB (the extractor normalizes
# whitespace) rather than false-positive, so re-enabling them is safe. The
# meaningful ones (nested/multiline ternary, if/unless-modifier, rescue-modifier,
# parallel-assignment, useless-assignment, identical-branches) now guard templates.
# Lint/Syntax is deliberately left excluded: rubocop forbids reconfiguring it.
Layout/ArgumentAlignment:
  Exclude: []
  Include:
    - '**/*.erb'
Layout/ArrayAlignment:
  Exclude: []
  Include:
    - '**/*.erb'
