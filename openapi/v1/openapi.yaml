---
openapi: 3.0.1
info:
  title: Play by Post API
  version: v1
  description: |
    Token-authenticated data API for a game's pages and notebook entries.

    Authorization is via bearer token. You can create one in your profile.
paths:
  "/api/notebook_entries":
    get:
      summary: List notebook entries
      tags:
      - Notebook Entries
      security:
      - bearer_token: []
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive substring match on the entry title.
      - name: created_by
        in: query
        required: false
        schema:
          type: integer
        description: Keep only entries created by this user id (the editor of the
          entry's first version; immutable across later versions).
      - name: edited_by
        in: query
        required: false
        schema:
          type: integer
        description: Keep only entries this user id authored any version of (creator
          or later editor).
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO-8601 timestamp; keep only entries created at or after it.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - oldest
          default: newest
        description: Sort by creation time. Defaults to newest first.
      responses:
        '200':
          description: notebook entries for the token's game
        '401':
          description: no token
        '403':
          description: banned GM is denied
    post:
      summary: Create a notebook entry
      tags:
      - Notebook Entries
      security:
      - bearer_token: []
      parameters: []
      responses:
        '201':
          description: notebook entry created in a chosen lane
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/notebook_entry"
        '400':
          description: an out-of-range status is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '401':
          description: no token
        '403':
          description: banned GM is denied
        '422':
          description: blank title is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/notebook_entry_input"
  "/api/notebook_entries/{slug}":
    get:
      summary: Show a notebook entry
      tags:
      - Notebook Entries
      security:
      - bearer_token: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: notebook entry found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/notebook_entry"
        '401':
          description: no token
        '403':
          description: banned GM is denied
        '404':
          description: unknown slug
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
    patch:
      summary: Update a notebook entry
      tags:
      - Notebook Entries
      security:
      - bearer_token: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: notebook entry moved to another lane
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/notebook_entry"
        '400':
          description: an out-of-range status is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '401':
          description: no token
        '403':
          description: banned GM is denied
        '404':
          description: unknown slug
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '422':
          description: blank title is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/notebook_entry_input"
  "/api/pages":
    get:
      summary: List pages
      tags:
      - Pages
      security:
      - bearer_token: []
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
        description: Case-insensitive substring match on the page title.
      - name: created_by
        in: query
        required: false
        schema:
          type: integer
        description: Keep only pages created by this user id (the editor of the page's
          first version; immutable across later versions).
      - name: edited_by
        in: query
        required: false
        schema:
          type: integer
        description: Keep only pages this user id authored any version of (creator
          or later editor).
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: ISO-8601 timestamp; keep only pages created at or after it.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - oldest
          default: newest
        description: Sort by creation time. Defaults to newest first.
      responses:
        '200':
          description: the GM sees published pages and their own drafts
        '401':
          description: no token
        '403':
          description: banned member is denied
    post:
      summary: Create a page
      tags:
      - Pages
      security:
      - bearer_token: []
      parameters: []
      responses:
        '201':
          description: page created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/page"
        '401':
          description: no token
        '403':
          description: active non-GM member is denied
        '422':
          description: blank title is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/page_input"
  "/api/pages/{slug}":
    get:
      summary: Show a page
      tags:
      - Pages
      security:
      - bearer_token: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: published page found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/page"
        '401':
          description: no token
        '403':
          description: a draft page is denied to a non-GM member
        '404':
          description: unknown slug
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
    patch:
      summary: Update a page
      tags:
      - Pages
      security:
      - bearer_token: []
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: page updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/page"
        '401':
          description: no token
        '403':
          description: active non-GM member is denied
        '404':
          description: unknown slug
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
        '422':
          description: blank title is rejected
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/page_input"
servers:
- url: https://play-by-post.example.com
components:
  securitySchemes:
    bearer_token:
      type: http
      scheme: bearer
  schemas:
    page:
      type: object
      properties:
        slug:
          type: string
          description: 16-char stable identifier
        title:
          type: string
        body:
          type: string
          description: Raw markdown
        created_by_id:
          type: integer
          nullable: true
          description: User id of the creator (immutable across versions)
        edited_by_id:
          type: integer
          nullable: true
          description: User id of the most recent editor
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - slug
      - title
      - body
    page_input:
      type: object
      properties:
        page:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
              description: Raw markdown
      required:
      - page
    notebook_entry:
      type: object
      properties:
        slug:
          type: string
          description: 16-char stable identifier
        title:
          type: string
        body:
          type: string
          description: Raw markdown
        status:
          type: string
          enum:
          - new
          - expand
          - done
          - discard
        created_by_id:
          type: integer
          nullable: true
          description: User id of the creator (immutable across versions)
        edited_by_id:
          type: integer
          nullable: true
          description: User id of the most recent editor
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - slug
      - title
      - body
      - status
    notebook_entry_input:
      type: object
      properties:
        notebook_entry:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
              description: Raw markdown
            status:
              type: string
              enum:
              - new
              - expand
              - done
              - discard
              description: 'Kanban lane. Optional: omit to keep `new` on create or
                leave unchanged on update. A status change is validated through the
                shared lane-move path.'
      required:
      - notebook_entry
    errors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: string
      required:
      - errors
security:
- bearer_token: []
