name: CI

on:
  pull_request:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/ci-run bin/brakeman --no-pager

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/ci-run bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/ci-run bin/rubocop -f github

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Type check with Sorbet
        run: bin/ci-run bundle exec srb tc

  design_tokens:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check design-token adherence
        run: bin/ci-run bin/check-design-tokens

  mutant_registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check mutation registration
        run: bin/ci-run bin/check-mutant-coverage

  policy_coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check every authorizable model has a policy
        run: bin/ci-run bin/check-policy-coverage

  authorization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check every controller installs the authorization net
        run: bin/ci-run bin/check-authorization

  controller_ivars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Ratchet controller instance-variable counts
        run: bin/ci-run bin/check-controller-ivars

  service_modules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check stateless services are modules
        run: bin/ci-run bin/check-service-modules

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config imagemagick

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Playwright browsers
        run: |
          export PLAYWRIGHT_CLI_VERSION=$(bundle exec ruby -e 'require "playwright"; puts Playwright::COMPATIBLE_PLAYWRIGHT_VERSION.strip')
          npm install playwright@${PLAYWRIGHT_CLI_VERSION} || npm install playwright@next
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run tests
        env:
          RAILS_ENV: test
          PLAYWRIGHT_CLI_EXECUTABLE_PATH: ./node_modules/.bin/playwright
        run: bin/ci-run bundle exec rspec

      # On a docs-only change rspec is skipped, so no coverage is produced. Stub
      # the artifact files the downstream quality_gate expects, keeping the
      # artifact chain intact without special-casing later jobs.
      - name: Stub coverage artifacts on docs-only change
        run: |
          if bin/docs-only; then
            mkdir -p coverage
            echo '{}' > coverage/.last_run.json
            echo '{}' > coverage/.resultset.json
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: |
            coverage/.last_run.json
            coverage/.resultset.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  mutation:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Run mutation testing
        env:
          RAILS_ENV: test
        run: |
          if bin/docs-only; then
            echo "==> Docs-only change: skipping mutation testing."
            mkdir -p tmp
            echo "Docs-only change — mutation skipped." > tmp/mutant_output.txt
            echo '{"coverage":100.0,"mutations":0,"kills":0,"alive":0}' > tmp/mutant_result.json
          else
            bundle exec mutant run --usage opensource --jobs 4 --since origin/master 2>&1 | tee tmp/mutant_output.txt || true
            bin/quality-metrics --record-mutant tmp/mutant_output.txt
          fi

      - name: Upload mutant results
        uses: actions/upload-artifact@v7
        with:
          name: mutant-data
          path: |
            tmp/mutant_result.json
            tmp/mutant_output.txt

  quality_gate:
    runs-on: ubuntu-latest
    needs: [test, mutation, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          name: coverage-data
          path: coverage/

      - name: Download mutant results
        uses: actions/download-artifact@v8
        with:
          name: mutant-data
          path: tmp/

      - name: Run quality gate
        run: bin/ci-run bin/quality-metrics --check

  # Build-verification. Runs in PARALLEL with the gate jobs, on every event
  # (pull requests included), so a broken Dockerfile / assets:precompile is
  # caught before merge — not only after a master push. It never pushes an
  # image; publishing is the separate `publish` job below.
  #
  # Builds a linux/arm64 production image (arm64 is required: the deploy target
  # is a Raspberry Pi 4 / aarch64; an amd64-only image will not run there).
  # Uses ubuntu-24.04-arm runners for native builds — no QEMU emulation.
  build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: docs
        run: |
          if bin/docs-only; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Docker Buildx
        if: steps.docs.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        if: steps.docs.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          # Warm the shared cache from master pushes only, so PR builds don't
          # thrash it; every build reads from it.
          cache-from: type=gha
          cache-to: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'type=gha,mode=max' || '' }}

  # Publish + deploy. Only after EVERY gate and the build have passed, and only
  # for master pushes / version tags — never for pull requests. Reuses the gha
  # cache warmed by `build`, so this rebuild is fast.
  publish:
    runs-on: ubuntu-24.04-arm
    needs: [scan_ruby, scan_js, lint, typecheck, test, mutation, quality_gate, build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: docs
        run: |
          if bin/docs-only; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Docker Buildx
        if: steps.docs.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.docs.outputs.skip != 'true'
        uses: docker/login-action@v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        if: steps.docs.outputs.skip != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: steps.docs.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.docs.outputs.skip != 'true'
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: linux/arm64" >> "$GITHUB_STEP_SUMMARY"

      # Coolify is not exposed to the internet, so we trigger the deploy through
      # the app's internet-facing relay endpoint, which forwards to Coolify over
      # the internal network. Only on master pushes (not tags / manual runs), and
      # never for a docs-only change (nothing new to deploy).
      - name: Trigger deploy
        if: github.ref == 'refs/heads/master' && steps.docs.outputs.skip != 'true'
        run: |
          curl --fail --silent --show-error \
            --request POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
