name: Build image

# Builds a linux/arm64 production image and pushes it to GHCR.
# arm64 is required: the deployment target is a Raspberry Pi 4 (aarch64).
# An amd64-only image will not run there.
#
# Uses ubuntu-24.04-arm runners for native builds — no QEMU emulation.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Platform: linux/arm64" >> "$GITHUB_STEP_SUMMARY"

      # Coolify is not exposed to the internet, so we trigger the deploy through
      # the app's internet-facing relay endpoint, which forwards to Coolify over
      # the internal network. Only on master pushes (not tags / manual runs).
      - name: Trigger deploy
        if: github.ref == 'refs/heads/master'
        run: |
          curl --fail --silent --show-error \
            --request POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            --header "Authorization: Bearer ${{ secrets.DEPLOY_WEBHOOK_SECRET }}"
