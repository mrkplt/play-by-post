---
usage: opensource

environment_variables:
  RAILS_ENV: test
  MUTANT: "1"

hooks:
  - .mutant/hooks.rb

requires:
  - ./config/environment

integration:
  name: rspec

matcher:
  subjects:
    # Models
    - AiUsage
    - Game
    - RssToken
    - SceneSummary
    - GameExportRequest
    - GameMember
    - GameFile
    - Character
    - CharacterVersion
    - Scene
    - SceneParticipant
    - Post
    - User
    - UserProfile
    - Invitation
    - NotificationPreference
    - PostRead
    - Feedback
    # Presenters
    - GameFilePresenter
    - GamePresenter
    - PostPresenter
    - SceneSummaryPresenter
    - ScenePresenter
    - UserPresenter
    # Components
    - Shared::AiSummariesToggleComponent
    - Shared::RssTokenComponent
    - Shared::SceneSummaryComponent
    - Shared::SceneSummaryEntryComponent
    - Shared::SceneSummaryFormComponent
    - Shared::SceneSummaryIndexPageComponent
    - Shared::FileUploadFormComponent
    - Shared::InvitePanelComponent
    - Shared::GalleryComponent
    - Shared::NavShellComponent
    - Shared::PostComposerComponent
    - Shared::PostItemComponent
    - Shared::SceneCardComponent
    - Shared::SceneFormComponent
    - Shared::SidebarComponent
    - Shared::TreeNodeComponent
    - Shared::GameHeaderComponent
    - Shared::NavDrawerComponent
    - Shared::GameCardComponent
    - Shared::RosterRowComponent
    - Shared::PageHeaderComponent
    - Shared::MobileFrameComponent
    - Shared::DeleteGameComponent
    - Shared::FeedbackModalComponent
    - Ui::BadgeComponent
    - Ui::BreadcrumbComponent
    - Ui::ButtonComponent
    - Ui::GlowComponent
    - Ui::AvatarComponent
    - Ui::CardComponent
    - Ui::SectionLabelComponent
    - Ui::ToggleSwitchComponent
    - Ui::IconButtonComponent
    - Ui::SettingsRowComponent
    - Ui::PillTabsComponent
    - Ui::FlashComponent
    # Services
    - AttachmentUploader
    - ExportDelivery
    - EmailContentExtractor
    - GameExportService
    - MarkdownRenderer
    - SceneSummaryService
    # Controllers
    - ActionMailbox::Ingresses::Resend::InboundEmailsController
    - Webhooks::DeployController
    - SceneSummariesController
    - GameExportsController
    - ScenesController
    - CharactersController
    - GamesController
    - SceneParticipantsController
    - PostsController
    - GameFilesController
    - InvitationsController
    - GameMembersController
    - CharacterVersionsController
    - ProfilesController
    - PlayerManagementController
    - FeedbacksController
    - Users::SessionsController
    # Jobs
    - PostDigestJob
    - ExportJob
    - ExportCleanupJob
    - SceneSummaryJob
    - CoolifyDeployJob
    - GamePurgeSweepJob
    - GamePurgeJob
    # Mailers
    - NotificationMailer
    - InvitationMailer
    - ExportMailer
    # Mailboxes
    - SceneMailbox
    # Helpers
    - ApplicationHelper
    # Policies
    - ApplicationPolicy
    - ApplicationPolicy::Scope
    - CharacterPolicy
    - CharacterPolicy::Scope
    - ScenePolicy
    - ScenePolicy::Scope
    - GamePolicy
    - GameMemberPolicy
    - InvitationPolicy
    - PostPolicy
    - GameFilePolicy
    - SceneSummaryPolicy
    - CharacterVersionPolicy
    - UserProfilePolicy
    - FeedbackPolicy

mutation:
  timeout: 20.0

coverage_criteria:
  timeout: false
  process_abort: false
  test_result: true
