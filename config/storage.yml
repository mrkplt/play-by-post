test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible object storage — Cloudflare R2 in production.
#
# Values come from encrypted credentials (credentials.storage.*), falling back to
# env vars for local runs without the credentials key. Documented in
# docs/CONFIGURATION.md (source of truth).
<% storage = Rails.application.credentials.storage || {} %>
cloudflare_r2:
  service: S3
  access_key_id: <%= storage[:access_key_id] || ENV["STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= storage[:secret_access_key] || ENV["STORAGE_SECRET_ACCESS_KEY"] %>
  region: <%= storage[:region] || ENV.fetch("STORAGE_REGION", "auto") %>
  bucket: <%= storage[:bucket] || ENV["STORAGE_BUCKET"] %>
  endpoint: <%= storage[:endpoint] || ENV["STORAGE_ENDPOINT"] %>
  force_path_style: true

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

